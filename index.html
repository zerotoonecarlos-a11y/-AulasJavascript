<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Estilizado</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- jQuery UI CSS Base -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <!-- Estilização Customizada -->
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estilização do Menu Autocomplete do jQuery UI */
        .ui-autocomplete {
            border: none !important;
            border-radius: 8px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
            padding: 8px 0 !important;
            background-color: #ffffff !important;
            font-family: inherit;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1050 !important;
        }

        .ui-menu-item-wrapper {
            padding: 10px 16px !important;
            color: #333333 !important;
            border: none !important;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        /* Estado Hover/Foco no Item da Lista */
        .ui-menu-item-wrapper.ui-state-active,
        .ui-menu-item-wrapper:hover {
            background-color: #0d6efd !important;
            color: #ffffff !important;
            border-radius: 4px;
            margin: 0 4px;
        }

        /* Transição Suave nos Campos */
        .form-control, .btn {
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Cabeçalho Principal -->
    <header class="bg-dark text-white py-4 mb-5 shadow-sm">
        <div class="container text-center">
            <h1 class="fw-bold mb-1">Bem-Vindo!</h1>
            <p class="text-secondary mb-0">Esse é um site construído para te fazer feliz</p>
        </div>
    </header>

    <!-- Conteúdo Principal em Formato de Cartão -->
    <main class="container flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    
                    <div class="text-center mb-4">
                        <h2 id="titulo" class="h4 text-dark fw-bold mb-2">Olá meu amigo.</h2>
                        <p id="paragrafo" class="text-primary fw-semibold mb-0" style="min-height: 24px;"></p>
                    </div>

                    <div class="mb-4">
                        <label for="texto" class="form-label text-muted small fw-bold">DIGITE UMA MENSAGEM</label>
                        <input type="text" id="texto" placeholder="Comece a digitar (ex: Ola, Como)..." class="form-control form-control-lg rounded-3 fs-6" />
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-primary btn-lg rounded-3 fs-6 fw-bold" id="meuButao">
                            Clique aqui para alterar o texto
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <script>
        $(document).ready(function () {
            
            const daddosAutoComplet = [
                "Ola meu amigo",
                "Como voce esta?",
                "Espero que esteja bem",
                "Se cuida",
                "Ate mais"
            ];

            // Configuração do Autocomplete
            $('#texto').autocomplete({
                source: daddosAutoComplet,
                minLength: 1 // Começa a sugerir ao digitar 1 caractere
            });

            // Evento do Botão
            $('#meuButao').click(function () {
                $('#titulo').text('Olá meu amigo, você clicou no botão!');
                $('#paragrafo').text('Parabéns!');
            });

        });
    </script>
</body>

</html>
