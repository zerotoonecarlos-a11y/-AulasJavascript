<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação do DOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <link rel="stylesheet" href="dom1.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="bg-primary text-white py-3 mb-4 shadow-md">
        <div class="container text-center">
            <h1>Manipulação do DOM</h1>
        </div>
    </header>

    <main class="container flex-grow-1">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <h2 class="mb-4" id="titulo">Exemplo de Manipulação do DOM</h2>
                <h3 class="mb-3 texto--roxo">Clique no botão abaixo para alterar o texto do parágrafo:</h3>
                <h4 class="mb-3 texto--roxo">Você pode alterar o conteúdo do parágrafo usando JavaScript.</h4>
                <p class="mb-5" id="demo">Este é um parágrafo de exemplo.</p>

                <div class="d-grid">
                <button id="changeTextBtn" type="button" class="btn btn-primary">Alterar Texto</button>
                </div>
            </div>
        </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="dom1.js" type="text/javascript"></script>
</body>

</html>
