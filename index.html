<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container bg-dark text-white">
        <h1>Bem Vindo!</h1>
        <p>Esse e um site construido para te fazer feliz</p>
    </div>

    <div class="container">
        <h1 id="titulo">Olá meu amigo.</h1>
        <h1 id="paragrafo"></h1>
        <br />
        <br />

        <input type="text" id="texto" placeholder="Digite seu texto aqui" class="form-control" />

        <br />

        <button type="button" class="btn btn-primary" id="meuButao">Clique aqui para alterar o texto</button>
    </div>











    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous">
        </script>

    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script>
        $('#meuButao').click(function () {
            $('#titulo').text('Ola meu amigo, voce clicou no botao');
            $('#paragrafo').text('Seu viado')
        });

        $('#texto').autocomplete({
            source: daddosAutoComplet
        });

        const daddosAutoComplet = [
            "Ola meu amigo",
            "Como voce esta?",
            "Espero que esteja bem",
            "Se cuida",
            "Ate mais"
        ];
    </script>
</body>

</html>
